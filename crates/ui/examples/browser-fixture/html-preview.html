<!-- A child policy must not relax the inherited wrapper policy. -->
<meta http-equiv="Content-Security-Policy" content="default-src * data: blob: 'unsafe-inline'; connect-src *">
<div class="viz-carousel" aria-label="Design variants"><section data-variant="First">One</section><section data-variant="Second" hidden>Two</section></div>
<script>
// Executed by the actual native WebKit host inside the opaque srcdoc frame.
document.addEventListener('DOMContentLoaded', async () => {
  const check = (value, message) => { if (!value) throw Error(message); };
  try {
    check(window.openai && typeof Tweak === 'function', 'compatibility runtime');
    check(Object.keys(openai.widgetState).length === 0, 'reload retained state');
    let isolated = false; try { void parent.document.body; } catch { isolated = true; }
    check(isolated, 'parent DOM is accessible');
    isolated = false; try { localStorage.setItem('preview', 'value'); } catch { isolated = true; }
    check(isolated, 'origin storage is accessible');
    // WebKit may return an empty cookie string rather than throw for an
    // opaque srcdoc origin. Either behavior must deny reading/writing data.
    isolated = false;
    try {
      isolated = document.cookie === '';
      if (isolated) { try { document.cookie = 'preview=value'; isolated = document.cookie === ''; } catch {} }
    } catch { isolated = true; }
    check(isolated, 'cookies are writable');
    for (const name of ['callTool', 'sendFollowUpMessage', 'openExternal']) check(openai[name] === undefined, 'host SDK exposed');
    check(!window.webkit?.messageHandlers?.ipc && !window.ipc, 'native messaging bridge exposed');
    let events = 0; let received;
    const bound = { answer: 'a', translation: false };
    const tweaks = new Tweak({ onChange: () => events++ });
    const select = tweaks.addSelect(bound, 'answer', { options: ['a', 'b'] });
    const toggle = tweaks.addToggle(bound, 'translation');
    select.selectedIndex = 1; select.dispatchEvent(new Event('change'));
    toggle.checked = true; toggle.dispatchEvent(new Event('change'));
    check(bound.answer === 'b' && bound.translation && events === 2, 'controls did not bind');
    window.addEventListener('openai:set_globals', event => {
      received = event.detail.globals.widgetState; Object.assign(bound, received);
    });
    await openai.setWidgetState({ answer: 'a', translation: false, nested: { x: 1 } });
    await Promise.resolve();
    check(select.selectedIndex === 0 && !toggle.checked, 'controls did not refresh after globals');
    received.nested.x = 9; const copy = openai.widgetState; copy.nested.x = 8;
    check(openai.widgetState.nested.x === 1, 'state/event copies alias');
    for (const value of [null, [], { x: 'é'.repeat(32765) }]) {
      let rejected = false; try { await openai.setWidgetState(value); } catch { rejected = true; }
      check(rejected, 'invalid/oversized state accepted');
    }
    const slides = document.querySelectorAll('section[data-variant]');
    const nav = document.querySelector('.viz-carousel nav');
    nav.lastChild.click(); check(slides[0].hidden && !slides[1].hidden, 'carousel next');
    nav.firstChild.click(); check(!slides[0].hidden && slides[1].hidden, 'carousel previous');
    const rejects = async address => { let blocked = false; try { await fetch(address); } catch { blocked = true; } check(blocked, 'fetch succeeded'); };
    await rejects('{{origin}}/fetch'); await rejects('file:///etc/passwd');
    // These would reach the loopback sink if CSP/navigation policy failed.
    const connect = document.createElement('link'); connect.rel = 'preconnect'; connect.href = '{{origin}}'; document.head.append(connect);
    const preload = document.createElement('link'); preload.rel = 'preload'; preload.as = 'script'; preload.href = '{{origin}}/preload'; document.head.append(preload);
    const style = document.createElement('style'); style.textContent = 'body{background-image:url({{origin}}/css)}'; document.head.append(style);
    try { navigator.sendBeacon('{{origin}}/beacon', 'probe'); } catch {}
    const image = new Image(); image.src = '{{origin}}/image'; document.body.append(image);
    const script = document.createElement('script'); script.src = '{{origin}}/script'; document.body.append(script);
    const link = document.createElement('a'); link.href = '{{origin}}/navigate'; link.click();
    const frame = document.createElement('iframe'); frame.src = '{{origin}}/frame'; document.body.append(frame);
    const form = document.createElement('form'); form.action = '{{origin}}/form'; document.body.append(form);
    try { form.submit(); } catch {}
    try { const socket = new WebSocket('{{origin}}/websocket'.replace('http:', 'ws:')); socket.onerror = () => {}; } catch {}
    let popup = null; try { popup = window.open('{{origin}}/popup'); } catch {}
    check(popup === null, 'popup escaped sandbox');
    // CSP alone does not block STUN/data channels. The native host must disable
    // WebRTC, not just replace the JavaScript constructor in this one realm.
    if (typeof RTCPeerConnection === 'function') {
      let rtcBlocked = false;
      try { const peer = new RTCPeerConnection(); peer.createDataChannel('probe'); peer.close(); }
      catch { rtcBlocked = true; }
      check(rtcBlocked, 'native WebRTC remains enabled');
    }
    let topBlocked = false;
    try { top.location = '{{origin}}/top'; } catch { topBlocked = true; }
    check(topBlocked, 'top navigation allowed');
    tweaks.dispose(); check(!tweaks.host.isConnected, 'controls disposal');
    setTimeout(() => parent.postMessage('preview:pass', '*'), 250);
  } catch (error) { parent.postMessage('preview:fail:' + error.message, '*'); }
});
</script>
